services:
  backend:
    build: ./backend
    container_name: itbis_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres_db:5432/itbis
      - MONGO_URL=mongodb://mongo_db:27017
      - MONGODB_URL=mongodb://mongo_db:27017
      - MONGODB_DB_NAME=itbis
      - SECRET_KEY=${SECRET_KEY:-itbis_super_secret_jwt_key_for_milestone_4_production}
    depends_on:
      - postgres_db
      - mongo_db

  frontend:
    build: ./frontend
    container_name: itbis_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend

  postgres_db:
    image: postgres:15-alpine
    container_name: itbis_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=itbis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo_db:
    image: mongo:7
    container_name: itbis_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
